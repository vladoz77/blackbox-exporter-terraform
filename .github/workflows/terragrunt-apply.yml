name: Terrugrunt

on:
  workflow_dispatch:
    inputs:
      env:
        description: Target environment
        type: choice
        default: stage
        options:
        - stage
        - prod

permissions:
  id-token: write
  contents: read

jobs:
  deploy_servers:
    runs-on: ubuntu-latest
    env:
      WORKING_DIR: "terraform"
      ENV_NAME: ${{ github.event.inputs.env }}
      TERRAGRUNT_VERSION: "0.99.4"
      TERRAFORM_VERSION: "1.9.8"

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Config yandex provider
      run: |
        set -euo pipefail
        echo "Creating ~/.terraformrc for Yandex Cloud mirror"
        cat > ~/.terraformrc <<EOF
        provider_installation {
          network_mirror {
            url = "https://terraform-mirror.yandexcloud.net/"
            include = ["registry.terraform.io/*/*"]
          }
          direct {
             exclude = ["registry.terraform.io/*/*"]
          }
        }
        EOF

    - name: Generate IAM token
      id: get-iam-token
      uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
      with:
        yc-sa-id: ${{ secrets.YC_SA_ID }}

    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: ${{ env.TERRAFORM_VERSION }}
        terraform_wrapper: false

    - name: Setup Terragrunt
      run: |
        # Download and install Terragrunt
        set -euo pipefail
        curl -sL "https://github.com/gruntwork-io/terragrunt/releases/download/v${{ env.TERRAGRUNT_VERSION }}/terragrunt_linux_amd64" \
            -o /usr/local/bin/terragrunt
        chmod +x /usr/local/bin/terragrunt
        terragrunt --version
    
    - name: terragrunt init
      env:
        TF_VAR_iam_token: ${{ steps.get-iam-token.outputs.token }}
        TF_VAR_cloud_id: ${{ secrets.TF_VAR_CLOUD_ID }}
        TF_VAR_folder_id: ${{ secrets.TF_VAR_FOLDER_ID }}
        TF_VAR_ssh_pub_key: ${{ secrets.SSH_PUB_KEY }}
        AWS_ACCESS_KEY_ID:     ${{ secrets.ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        set -euo pipefail
        cd ${{ env.WORKING_DIR}}/${{ env.ENV_NAME }}
        terragrunt run --all init --non-interactive

    - name: terragrunt apply
      env:
        TF_VAR_iam_token: ${{ steps.get-iam-token.outputs.token }}
        TF_VAR_cloud_id: ${{ secrets.TF_VAR_CLOUD_ID }}
        TF_VAR_folder_id: ${{ secrets.TF_VAR_FOLDER_ID }}
        TF_VAR_ssh_pub_key: ${{ secrets.SSH_PUB_KEY }}
        AWS_ACCESS_KEY_ID:     ${{ secrets.ACCESS_KEY }}
        AWS_SECRET_ACCESS_KEY: ${{ secrets.SECRET_KEY }}
      run: |
        set -euo pipefail
        cd ${{ env.WORKING_DIR}}/${{ env.ENV_NAME }}
        terragrunt run --all apply --non-interactive

    - name: Upload inventory file as artifact
      uses: actions/upload-artifact@v4
      with:
        name: ansible-inventory
        path: ansible/inventories/${{env.ENV_NAME}}/inventory.ini
        if-no-files-found: error

  
  config_servers:
    name: provision server
    needs: deploy_servers
    runs-on: ubuntu-latest
    env:
      ENV_NAME: ${{ github.event.inputs.env }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download inventory artifact
        uses: actions/download-artifact@v4
        with:
          name: ansible-inventory
          path: ansible/inventories/${{env.ENV_NAME}}

      - name: Configure SSH key
        run: |
          set -euo pipefail
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIV_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
      
      - name: Install Ansible
        run: |
          set -euo pipefail
          pipx install ansible-core==2.12.3

      - name: Run Ansible playbook
        run: |
          set -euo pipefail
          cd ansible
          ansible-playbook -i inventories/${{env.ENV_NAME}}/inventory.ini blackbox-${{env.ENV_NAME}}.yaml \
          --ssh-extra-args "-o StrictHostKeyChecking=no" \
          --extra-vars "aws_access_key=${{ secrets.ACME_AWS_ACCESS_KEY }} aws_secret_key=${{ secrets.ACME_AWS_SECRET }}" \
          -u ubuntu
