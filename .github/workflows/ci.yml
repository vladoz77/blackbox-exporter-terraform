name: PR CI (no apply)

on:
  pull_request:
    paths:
      - "terraform/**"
      - "ansible/**"
      - ".github/workflows/**"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  checks:
    name: Format and syntax checks
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"

      - name: Terraform fmt (recursive)
        run: |
          set -euo pipefail
          terraform fmt -check -recursive terraform

      - name: Terragrunt HCL fmt (check)
        uses: gruntwork-io/terragrunt-action@v3
        with:
          tg_dir: terraform
          tg_command: "hcl fmt --check --diff"

      - name: Install Ansible
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ansible

      - name: Ansible playbooks syntax-check
        run: |
          set -euo pipefail
          cat > /tmp/inventory.ini <<'EOF'
          [monitoring-server]
          localhost ansible_connection=local

          [blackbox-server]
          localhost ansible_connection=local

          [monitoring-blackbox-server]
          localhost ansible_connection=local
          EOF

          ansible-playbook -i /tmp/inventory.ini ansible/blackbox-prod.yaml --syntax-check
          ansible-playbook -i /tmp/inventory.ini ansible/blackbox-stage.yaml --syntax-check

