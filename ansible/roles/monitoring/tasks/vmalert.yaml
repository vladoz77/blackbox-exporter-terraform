# tasks/vmalert.yaml
- name: create project {{ vmalert_container_name }}
  ansible.builtin.file:
    path: "{{ vmalert_dir }}"
    group: "{{ username }}"
    owner: "{{ username }}"
    state: directory

- name: create folder rules
  ansible.builtin.file:
    path: "{{ vmalert_rules_folder }}"
    group: "{{ username }}"
    owner: "{{ username }}"
    state: directory

- name: Copy rules
  ansible.builtin.copy:
    src: files/rules/
    dest: "{{ vmalert_rules_folder }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"

- name: Create Vmalert docker-compose file
  ansible.builtin.template:
    src: templates/vmalert_compose.yaml.j2
    dest: "{{ vmalert_dir }}/docker-compose.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
    validate: "docker compose -f %s config -q"
  notify: restart vmalert

- name: Flush handlers
  meta: flush_handlers

- name: Wait for Vmalert to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ vmalert_port }}/health"
    method: GET
    status_code: 200
    timeout: 10
  register: vmalert_health
  until: vmalert_health.status == 200
  retries: 20
  delay: 10
