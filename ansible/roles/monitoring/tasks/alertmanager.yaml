# tasks/alertmanager.yaml
- name: create folder {{ alertmanager_container_name }}
  ansible.builtin.file:
    path: "{{ alertmanager_dir }}"
    group: "{{ username }}"
    owner: "{{ username }}"
    state: directory

- name: copy template alertmanager to {{ alertmanager_dir }}
  ansible.builtin.template:
    src: templates/alertmanager.yaml.j2
    dest: "{{ alertmanager_dir }}/alertmanager.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
  notify: restart alertmanager

- name: Create Alertmanager docker-compose file
  ansible.builtin.template:
    src: templates/alertmanager_compose.yaml.j2
    dest: "{{ alertmanager_dir }}/docker-compose.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
  notify: restart alertmanager

- name: Flush handlers
  meta: flush_handlers

- name: Wait for Alertmanager to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ alertmanager_port }}/-/healthy"
    method: GET
    status_code: 200
    timeout: 10
  register: am_health
  until: am_health.status == 200
  retries: 20
  delay: 10