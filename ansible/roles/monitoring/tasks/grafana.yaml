# tasks/grafana.yaml
- name: create project {{ grafana_container_name }}
  ansible.builtin.file:
    path: "{{ grafana_dir }}"
    group: "{{ username }}"
    owner: "{{ username }}"
    state: directory

- name: create folder dashboards
  ansible.builtin.file:
    path: "{{ dashboards_folder }}"
    group: "{{ username }}"
    owner: "{{ username }}"
    state: directory

- name: Copy dashboards
  ansible.builtin.copy:
    src: files/dashboards/
    dest: "{{ dashboards_folder }}"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"

- name: copy templates for dashboards.yaml to {{ grafana_dir }}
  ansible.builtin.template:
    src: templates/dashboards.yaml.j2
    dest: "{{ grafana_dir }}/dashboards.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"
    validate: 'python3 -c "import yaml; yaml.safe_load(open(\"%s\"))"'
    mode: "0644"

- name: copy template datasources.yaml  to {{ grafana_dir }}
  ansible.builtin.template:
    src: templates/datasources.yaml.j2
    dest: "{{ grafana_dir }}/datasources.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"
    validate: 'python3 -c "import yaml; yaml.safe_load(open(\"%s\"))"'
    mode: "0644"

- name: Create Grafana docker-compose file
  ansible.builtin.template:
    src: templates/grafana_compose.yaml.j2
    dest: "{{ grafana_dir }}/docker-compose.yaml"
    owner: "{{ username }}"
    mode: "0644"
    validate: "docker compose -f %s config -q"
  notify: restart grafana

- name: Flush handlers
  meta: flush_handlers

- name: Wait for Grafana to be ready
  ansible.builtin.uri:
    url: "http://localhost:{{ grafana_port }}/api/health"
    method: GET
    status_code: 200
    timeout: 10
  register: grafana_health
  until: grafana_health.status == 200
  retries: 40
  delay: 15
