# tasks/victoriametrics.yaml
- name: create folder {{ victoriametrics_container_name }}
  ansible.builtin.file:
    path: "{{ victoriametrics_dir }}"
    group: "{{ username }}"
    owner: "{{ username }}"
    state: directory

- name: Create additional scrape configs directory
  ansible.builtin.file:
    path: "{{ additional_scrape_configs_dir }}"
    state: directory
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0755"

- name: copy template scrape config to {{ victoriametrics_dir }}
  ansible.builtin.template:
    src: templates/scrape.yaml.j2
    dest: "{{ victoriametrics_dir }}/scrape.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
  notify: restart victoriametrics

- name: Create Victoriametrics docker-compose file
  ansible.builtin.template:
    src: templates/victoriametrics_compose.yaml.j2
    dest: "{{ victoriametrics_dir }}/docker-compose.yaml"
    owner: "{{ username }}"
    group: "{{ username }}"
    mode: "0644"
  notify: restart victoriametrics

- name: Flush handlers
  meta: flush_handlers

- name: Wait for VictoriaMetrics to be healthy
  ansible.builtin.uri:
    url: "http://localhost:{{ victoriametrics_port }}/health"
    method: GET
    status_code: 200
    timeout: 10
  register: vm_health
  until: vm_health.status == 200
  retries: 30
  delay: 10