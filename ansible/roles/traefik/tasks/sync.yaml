# tasks/sync.yaml
- name: Assert AWS credentials are provided when syncing ACME to S3
  ansible.builtin.assert:
    that:
      - aws_access_key is defined
      - aws_access_key | string | length > 0
      - aws_secret_key is defined
      - aws_secret_key | string | length > 0
    fail_msg: "aws_access_key/aws_secret_key must be set when traefik_acme_sync_to_s3 is true"

- name: Determine ACME file and S3 key
  set_fact:
    acme_local_file: "{{ traefik_acme_file_staging if traefik_acme_staging else traefik_acme_file_prod }}"
    acme_s3_key: "{{ s3_key_staging if traefik_acme_staging else s3_key_prod }}"

- name: Ensure acme.json exists locally
  ansible.builtin.stat:
    path: "{{ acme_local_file }}"
  register: local_acme

- name: Skip sync when acme.json is not created yet
  ansible.builtin.debug:
    msg: "Skip ACME sync: {{ acme_local_file }} does not exist yet"
  when: not local_acme.stat.exists

- name: Refresh acme.json status before upload
  ansible.builtin.stat:
    path: "{{ acme_local_file }}"
  register: acme_stat
  when: local_acme.stat.exists

- name: Skip sync when acme.json is still empty
  ansible.builtin.debug:
    msg: "Skip ACME sync: {{ acme_local_file }} is still empty and Traefik has not issued a certificate yet"
  when:
    - local_acme.stat.exists
    - acme_stat.stat.size | int == 0

- name: Upload acme.json to S3 (always overwrite)
  amazon.aws.s3_object:
    bucket: "{{ s3_bucket_name }}"
    object: "{{ acme_s3_key }}"
    src: "{{ acme_local_file }}"
    mode: put
    access_key: "{{ aws_access_key }}"
    secret_key: "{{ aws_secret_key }}"
    endpoint_url: "{{ yandex_storage_endpoint }}"
    region: "{{ yandex_region }}"
    overwrite: always
    encrypt: false
    permission: []
  when:
    - local_acme.stat.exists
    - acme_stat.stat.size | int > 0

- name: Success message
  ansible.builtin.debug:
    msg: "{{ acme_s3_key }} successfully synced to s3://{{ s3_bucket_name }}/{{ acme_s3_key }}"
  when:
    - local_acme.stat.exists
    - acme_stat.stat.size | int > 0
