- name: Create user alloy
  ansible.builtin.user:
    name: "{{ alloy_username }}"
    groups: "{{ alloy_groups }}"
    append: true
    system: true
    shell: /usr/sbin/nologin
    state: present

- name: Create alloy config folder
  ansible.builtin.file:
    name: "{{ alloy_config_dir }}"
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Create alloy storage folder
  ansible.builtin.file:
    name: "{{ alloy_storage_dir }}"
    state: directory
    owner: "{{ alloy_username }}"
    group: "{{ alloy_username }}"
    mode: "0755"

- name: copy alloy config to {{ alloy_config_dir }}
  ansible.builtin.template:
    src: config.alloy.j2
    dest: "{{ alloy_config_dir }}/config.alloy"
    owner: root
    group: root
    mode: "0644"
    validate: "{{ install_path }}/alloy validate %s"
  notify: restart alloy

- name: copy systemd-unit for alloy
  ansible.builtin.template:
    src: alloy.service.j2
    dest: "{{ systemd_unit_dir }}/alloy.service"
    owner: root
    group: root
    mode: "0644"
  notify: restart alloy

- name: start alloy
  ansible.builtin.systemd:
    name: alloy
    state: started
    daemon_reload: true
    enabled: true
